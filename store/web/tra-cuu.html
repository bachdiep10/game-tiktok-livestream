<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tra cứu key & chuyển máy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="/media/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="/"><img class="logo-img" src="/media/logo.png" width="210" height="50" alt="netxioviet.com"><span class="sr" data-brand>LiveGame</span></a>
      <nav class="nav"><a href="/#game">Game</a><a href="/#bang-gia">Bảng giá</a><a href="/huong-dan.html">Hướng dẫn</a><a href="/tin-tuc">Tin tức</a><a class="acc" href="/tai-khoan.html" data-account>Đăng nhập</a><a class="btn sm ghost" data-zalo target="_blank" rel="noopener">Zalo hỗ trợ</a></nav>
    </div>
  </header>
  <main class="page">
    <div class="wrap">
      <div class="panel">
        <h1 style="font-size:28px;margin:0 0 6px">Tra cứu key & chuyển máy</h1>
        <p class="note" style="margin:0 0 20px">Nhập key (hoặc mã đơn hàng) và số điện thoại bạn dùng khi mua.</p>
        <form id="f">
          <div class="field"><label for="q">License key hoặc mã đơn</label><input id="q" required placeholder="LG-XXXX-XXXX-XXXX-XXXX"></div>
          <div class="field"><label for="p">Số điện thoại / Zalo đã mua</label><input id="p" required inputmode="tel"></div>
          <div class="err" id="err"></div>
          <button class="btn block" type="submit">Tra cứu</button>
        </form>
        <div id="recent"></div>
      </div>
      <div id="result"></div>
    </div>
  </main>
  <footer><div class="wrap"><div><b data-brand></b> · <span data-tagline></span></div><div>© <span data-year></span> <span data-brand></span></div></div></footer>

  <script type="module">
    import { $, api, esc, copy, applyBrand, gameList } from '/js/common.js';
    const fmt = (t) => t ? new Date(t).toLocaleString('vi-VN') : '—';

    function render(l, message) {
      $('#result').innerHTML = `
        <div class="panel">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
            <h2 style="margin:0;font-size:22px">${esc(l.planName)}</h2>
            <span class="status ${l.status === 'active' ? 'paid' : 'cancelled'}">${l.status === 'active' ? '✓ Đang hoạt động' : '✕ Đã khoá'}</span>
          </div>
          <div class="keybox"><code>${esc(l.key)}</code><button class="btn sm" data-copy="${esc(l.key)}">Sao chép</button></div>
          ${message ? `<p style="color:var(--ok);font-weight:600">${esc(message)}</p>` : ''}
          <div class="rows">
            <div><span>Đang gắn với máy</span><b>${l.machineName ? esc(l.machineName) : (l.activatedAt || l.lastSeen ? 'Không rõ tên máy' : 'Chưa kích hoạt')}</b></div>
            <div><span>Lần dùng gần nhất</span><b>${fmt(l.lastSeen)}</b></div>
            <div><span>Lượt chuyển máy còn lại</span><b>${l.movesLeft}</b></div>
          </div>
          <button class="btn ghost block" id="move" ${l.status !== 'active' ? 'disabled' : ''}>🔄 Chuyển key sang máy khác</button>
          <p class="note">Dùng khi đổi máy tính hoặc cài lại Windows. Key sẽ được gỡ khỏi máy cũ, sau đó bạn nhập key trên máy mới.</p>
          <h3 style="margin:24px 0 4px">Game trong key</h3>
          ${gameList(l.games, { canDownload: false })}
          <a class="btn block" style="margin-top:14px" href="/tai-khoan.html">👤 Đăng nhập để tải game</a>
        </div>`;
      $('#move').addEventListener('click', async () => {
        if (!confirm('Gỡ key khỏi máy hiện tại? Game trên máy cũ sẽ ngừng chạy.')) return;
        try {
          const r = await api('/api/lookup/move', { query: $('#q').value, phone: $('#p').value });
          render(r.license, r.message);
        } catch (e) { alert(e.message); }
      });
    }

    document.addEventListener('click', e => {
      const c = e.target.closest('[data-copy]');
      if (c) { e.preventDefault(); copy(c.dataset.copy); }
    });

    $('#f').addEventListener('submit', async e => {
      e.preventDefault();
      $('#err').textContent = '';
      try { render((await api('/api/lookup', { query: $('#q').value, phone: $('#p').value })).license); }
      catch (err) { $('#err').textContent = err.message; $('#result').innerHTML = ''; }
    });

    try {
      const list = JSON.parse(localStorage.getItem('lg_orders') || '[]');
      if (list.length) $('#recent').innerHTML = `<p class="note" style="margin-top:20px">Đơn đã mua trên trình duyệt này: ${list.map(o => `<a href="${esc(o.url)}">#${esc(o.code)}</a>`).join(', ')}</p>`;
    } catch {}
    applyBrand().catch(() => {});
  </script>
</body>
</html>
