<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kích hoạt bản quyền</title>
  <style>
    :root { --brand: #e8336f; --grad: linear-gradient(120deg, #ff3d7f, #ff7a59 50%, #ffb547); --text: #16132b; --muted: #615c7c; --line: rgba(22,18,52,.12); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text);
      background: radial-gradient(800px 500px at 85% -10%, rgba(124,92,255,.14), transparent 60%), radial-gradient(700px 500px at -10% 10%, rgba(255,122,89,.14), transparent 60%), #f6f6fb; }
    .card { width: min(480px, 100%); background: #fff; border-radius: 22px; padding: 30px; box-shadow: 0 24px 60px rgba(40,24,110,.14); }
    .logo { width: 52px; height: 52px; border-radius: 14px; background: var(--grad); display: grid; place-items: center; font-size: 26px; margin-bottom: 14px; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    p { color: var(--muted); margin: 0 0 18px; line-height: 1.55; }
    label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; }
    input { width: 100%; font: 600 18px ui-monospace, Consolas, monospace; letter-spacing: .05em; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; outline: none; text-transform: uppercase; }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255,61,127,.18); }
    .btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 999px; background: var(--grad); color: #fff; font: 700 16px inherit; font-family: inherit; cursor: pointer; text-decoration: none; }
    .btn.ghost { background: #fff; color: var(--text); border: 1px solid var(--line); }
    .btn:disabled { opacity: .6; cursor: wait; }
    .msg { margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 14.5px; display: none; }
    .msg.err { display: block; background: rgba(220,51,72,.08); color: #b4233a; }
    .msg.ok { display: block; background: rgba(15,157,99,.1); color: #0b7a4c; }
    .rows { margin: 16px 0 0; font-size: 14px; color: var(--muted); display: grid; gap: 6px; }
    .rows b { color: var(--text); }
    .foot { margin-top: 20px; font-size: 13.5px; color: var(--muted); text-align: center; line-height: 1.7; }
    .foot a { color: var(--brand); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔑</div>
    <h1 id="title">Kích hoạt bản quyền</h1>
    <p id="sub">Nhập license key bạn đã mua để mở game. Mỗi key dùng trên 1 máy tính.</p>
    <div id="form">
      <label for="key">License key</label>
      <input id="key" placeholder="LG-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
      <button class="btn" id="go">Kích hoạt</button>
    </div>
    <div class="msg" id="msg"></div>
    <div id="done" style="display:none">
      <div class="rows" id="info"></div>
      <a class="btn" id="open" href="/">Mở game</a>
      <button class="btn ghost" id="change">Đổi key khác</button>
    </div>
    <div class="foot" id="foot"></div>
  </div>
  <script>
    const $ = (s) => document.querySelector(s);
    let S;
    function render(s, justActivated) {
      S = s;
      $('#title').textContent = s.ok ? '✓ Đã kích hoạt' : `Kích hoạt ${s.product.name}`;
      $('#sub').textContent = s.ok ? `${s.product.name} đã sẵn sàng trên máy tính này.` : 'Nhập license key bạn đã mua để mở game. Mỗi key dùng trên 1 máy tính.';
      $('#form').style.display = s.ok ? 'none' : '';
      $('#done').style.display = s.ok ? '' : 'none';
      $('#open').href = s.product.control;
      $('#msg').className = 'msg' + (s.error ? ' err' : (justActivated && s.ok ? ' ok' : ''));
      $('#msg').textContent = s.error || (justActivated && s.ok ? 'Kích hoạt thành công!' : '');
      $('#info').innerHTML = s.ok ? `<div>Key: <b>${s.key}</b></div><div>Trạng thái: <b>${s.online ? 'đã kiểm tra trực tuyến' : 'đang dùng ngoại tuyến'}</b></div><div>Mã máy: <b>${s.machineId}</b> · Phiên bản <b>${s.version}</b></div>` : '';
      const site = s.product.server;
      $('#foot').innerHTML = `Chưa có key? <a href="${site}" target="_blank">Mua tại ${site.replace(/^https?:\/\//, '')}</a><br>Quên key, đổi máy? <a href="${site}/tai-khoan.html" target="_blank">Vào Tài khoản của tôi</a>`;
    }
    async function load() { render(await (await fetch('/license/status')).json()); }
    $('#go').onclick = async () => {
      const b = $('#go'); b.disabled = true; b.textContent = 'Đang kiểm tra…';
      try {
        const r = await fetch('/license/activate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: $('#key').value }) });
        render(await r.json(), true);
      } catch { $('#msg').className = 'msg err'; $('#msg').textContent = 'Không kết nối được chương trình game. Hãy mở lại file chạy game.'; }
      b.disabled = false; b.textContent = 'Kích hoạt';
    };
    $('#key').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#go').click(); });
    $('#change').onclick = () => { render({ ...S, ok: false, error: '' }); $('#key').focus(); };
    load();
  </script>
</body>
</html>
